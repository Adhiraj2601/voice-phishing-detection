# Voice Phishing (Vishing) Indicator Lexicon
# Categorized with associated risk weights and regex/phrase patterns

categories:
  urgency_threat:
    name: "Urgency and Coercion"
    weight: 1.5
    patterns:
      - "(?:immediately|urgent|within (?:the next )?\\d+ (?:minutes|hours)|right now|act fast)"
      - "(?:warrant|arrest|law enforcement|fbi|irs|police|custody|legal action)"
      - "(?:suspend(?:ed)?|freeze|frozen|terminate|cancel(?:led)?|penalty|fine)"
      - "(?:before it'?s too late|critical warning|final notice)"

  credential_harvesting:
    name: "Credential and Authentication Requests"
    weight: 2.2
    patterns:
      - "(?:one-time password|one time password|otp|verification code|security code)"
      - "(?:cvv|cvc|pin number|pin|password|passcode|secret answer)"
      - "(?:social security|ssn|national insurance|aadhaar|id number)"
      - "(?:read back the code|share the code|tell me the numbers?)"

  impersonation:
    name: "Entity Impersonation"
    weight: 1.6
    patterns:
      - "(?:internal revenue service|irs|federal trade commission|ftc|social security administration)"
      - "(?:microsoft support|apple support|amazon fraud department|google security team)"
      - "(?:bank of america|wells fargo|chase bank|fraud prevention department|fraud detection team)"
      - "(?:officer|detective|investigator|special agent)"

  financial_demand:
    name: "Unusual Payment and Fund Transfer"
    weight: 2.0
    patterns:
      - "(?:gift card|apple gift card|target gift card|google play card|steam card)"
      - "(?:bitcoin|crypto|cryptocurrency|bitcoin atm|coinbase|ethereum)"
      - "(?:wire transfer|western union|moneygram|zelle|cash app|venmo)"
      - "(?:safe account|safekeeping account|government safe account|offshore)"

  remote_access:
    name: "Remote Computer Access"
    weight: 2.0
    patterns:
      - "(?:anydesk|teamviewer|ultraviewer|quick assist|screen share|logmein)"
      - "(?:download software|install the application|allow remote access|grant control)"
      - "(?:connect to your (?:computer|phone|device|desktop))"

  secrecy_isolation:
    name: "Secrecy and Isolation Tactics"
    weight: 1.8
    patterns:
      - "(?:don'?t tell (?:anyone|your bank|your family|your spouse))"
      - "(?:keep this confidential|stay on the line|do not hang up)"
      - "(?:if the bank teller asks|tell them it'?s for home renovation|tell them it'?s for family)"
      - "(?:federal gag order|classified investigation)"
